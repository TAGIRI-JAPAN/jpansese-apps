    let userAnswers = {};
    let voices = [];

    function initVoices() {
        if ('speechSynthesis' in window) {
            voices = window.speechSynthesis.getVoices();
        }
    }
    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = initVoices;
        initVoices();
    }

    function playHybridAudio(qId, scriptHtml) {
        let audioPath = 'audio/q' + qId + '.mp3';
        let localAudio = new Audio(audioPath);

        localAudio.play().then(() => {
            console.log('Playing MP3 file: ' + audioPath);
        }).catch(() => {
            console.log('MP3 not found. Falling back to Dual-Speaker Speech Engine.');
            playDualSpeakerTTS(scriptHtml);
        });
    }

    function playDualSpeakerTTS(scriptHtml) {
        if (!('speechSynthesis' in window)) {
            alert('お使いのブラウザは音声読み上げに対応していません。');
            return;
        }

        window.speechSynthesis.cancel();

        let cleanText = scriptHtml.replace(/<rt>[^<]*<\/rt>/g, '').replace(/<[^>]*>/g, '');
        let lines = cleanText.split('<br>');
        
        let turns = [];
        lines.forEach(line => {
            let trimmed = line.trim();
            if (trimmed.startsWith('F:')) {
                turns.push({ speaker: 'F', text: trimmed.replace(/^F:\s*/, '') });
            } else if (trimmed.startsWith('M:')) {
                turns.push({ speaker: 'M', text: trimmed.replace(/^M:\s*/, '') });
            } else if (trimmed.length > 0) {
                turns.push({ speaker: 'N', text: trimmed });
            }
        });

        if (turns.length === 0) {
            turns.push({ speaker: 'N', text: cleanText });
        }

        let jpVoices = voices.filter(v => v.lang.includes('ja') || v.lang.includes('JP'));
        let femaleVoice = jpVoices.find(v => v.name.includes('Google') || v.name.includes('Kyoko') || v.name.includes('Haruka') || v.name.includes('Otoya')) || jpVoices[0];
        let maleVoice = jpVoices.find(v => v.name.includes('Ichiro') || v.name.includes('Hattori') || v.name.includes('Male')) || femaleVoice;

        turns.forEach((turn) => {
            let utterance = new SpeechSynthesisUtterance(turn.text);
            utterance.lang = 'ja-JP';
            utterance.rate = 0.83;

            if (turn.speaker === 'F') {
                utterance.pitch = 1.25;
                if (femaleVoice) utterance.voice = femaleVoice;
            } else if (turn.speaker === 'M') {
                utterance.pitch = 0.85;
                if (maleVoice) utterance.voice = maleVoice;
            } else {
                utterance.pitch = 1.0;
                if (femaleVoice) utterance.voice = femaleVoice;
            }

            window.speechSynthesis.speak(utterance);
        });
    }

    function renderApp() {
        const jumpContainer = document.getElementById('jump-buttons-container');
        const qWrapper = document.getElementById('questions-wrapper');
        
        jumpContainer.innerHTML = '';
        qWrapper.innerHTML = '';
        
        questionsData.forEach((q) => {
            const jBtn = document.createElement('div');
            jBtn.className = 'jump-btn';
            jBtn.id = 'jump-btn-' + q.id;
            jBtn.innerText = q.id;
            jBtn.onclick = () => {
                document.getElementById('q-card-' + q.id).scrollIntoView({ behavior: 'smooth', block: 'center' });
            };
            jumpContainer.appendChild(jBtn);
            
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = 'q-card-' + q.id;
            card.setAttribute('data-category', q.category);
            
            let vocabHtml = '';
            if(q.vocab && q.vocab.length > 0) {
                vocabHtml = `
                    <div class="vocab-box">
                        <h5>📚 単語・表現 (Vocabulary & Key Phrases)</h5>
                        <ul>
                            ` + q.vocab.map(v => `<li><strong>` + v.word + `</strong>: ` + v.en + ` / ` + v.si + `</li>`).join('') + `
                        </ul>
                    </div>
                `;
            }
            
            let optionsHtml = q.options.map((opt, optIdx) => `
                <li onclick="selectOption(` + q.id + `, ` + optIdx + `, ` + q.correct + `)">` + opt + `</li>
            `).join('');
            
            card.innerHTML = `
                <div class="question-header">
                    <span class="q-badge">Q` + q.id + `</span>
                    <span class="cat-tag">` + q.category_name + `</span>
                </div>
                <div class="audio-player-box">
                    <span>🔊 聴解男女対話音声 (Dialogue Player)</span>
                    <button class="play-btn" onclick="playHybridAudio(` + q.id + `, \`${q.passage.replace(/`/g, '\`')}\`)">▶️ 対話音声を再生 (Play)</button>
                </div>
                <div class="passage-box">` + q.passage + `</div>
                ` + vocabHtml + `
                <div class="q-text">` + q.question + `</div>
                <ul class="options-list" id="opts-q-` + q.id + `">
                    ` + optionsHtml + `
                </ul>
                <button class="expl-btn" onclick="toggleExpl(` + q.id + `)">💡 講師の超詳細解説 (Prep-School Masterclass)</button>
                <div class="expl-box" id="expl-box-` + q.id + `">
                    <div class="lang-tabs">
                        <button class="tab-btn active" onclick="switchLang(` + q.id + `, 'en')">🇬🇧 English</button>
                        <button class="tab-btn" onclick="switchLang(` + q.id + `, 'si')">🇱🇰 Sinhala</button>
                    </div>
                    <div class="tab-content active" id="expl-en-` + q.id + `">
                        <div class="tip-card">` + q.tip_en + `</div>
                    </div>
                    <div class="tab-content" id="expl-si-` + q.id + `">
                        <div class="tip-card">` + q.tip_si + `</div>
                    </div>
                </div>
            `;
            qWrapper.appendChild(card);
        });
    }

    function selectOption(qId, selectedIdx, correctIdx) {
        const optsList = document.getElementById('opts-q-' + qId).children;
        const jumpBtn = document.getElementById('jump-btn-' + qId);
        
        for(let i=0; i<optsList.length; i++) {
            optsList[i].style.borderColor = '#e2e8f0';
            optsList[i].style.background = '#ffffff';
            optsList[i].style.color = '#334155';
            optsList[i].innerText = optsList[i].innerText.replace(' ❌', '').replace(' ✅', '');
        }
        
        if(selectedIdx === correctIdx) {
            optsList[selectedIdx].style.borderColor = '#10b981';
            optsList[selectedIdx].style.background = '#ecfdf5';
            optsList[selectedIdx].style.color = '#065f46';
            optsList[selectedIdx].innerText += ' ✅';
            jumpBtn.className = 'jump-btn correct';
            userAnswers[qId] = true;
        } else {
            optsList[selectedIdx].style.borderColor = '#ef4444';
            optsList[selectedIdx].style.background = '#fef2f2';
            optsList[selectedIdx].style.color = '#991b1b';
            optsList[selectedIdx].innerText += ' ❌';
            jumpBtn.className = 'jump-btn wrong';
            userAnswers[qId] = false;
        }
        
        updateScore();
    }

    function updateScore() {
        const correctCount = Object.values(userAnswers).filter(v => v === true).length;
        document.getElementById('score-counter').innerText = '正解数: ' + correctCount + ' / ' + questionsData.length;
    }

    function toggleExpl(qId) {
        const box = document.getElementById('expl-box-' + qId);
        box.classList.toggle('active');
    }

    function switchLang(qId, lang) {
        const box = document.getElementById('expl-box-' + qId);
        box.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        box.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        
        document.getElementById('expl-' + lang + '-' + qId).classList.add('active');
        box.querySelector('button[onclick*="' + lang + '"]').classList.add('active');
    }

    function filterCategory(cat, ev) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        if(ev) ev.target.classList.add('active');
        
        const cards = document.getElementById('questions-wrapper').querySelectorAll('.question-card');
        cards.forEach(card => {
            if(cat === 'all' || card.getAttribute('data-category') === cat) {
                card.style.display = 'block';
            } else {
                card.style.display = 'none';
            }
        });
    }

    renderApp();
</script>
