<script>
    const questionsData = [{"id": 1, "category": "short", "category_name": "短文 (Short Passage)", "passage": "<ruby>学生時代<rt>がくせいじだい</rt></ruby>は<ruby>東京<rt>とうきょう</rt></ruby>に<ruby>住<rt>す</rt></ruby>んでいました。<ruby>人<rt>ひと</rt></ruby>が<ruby>多<rt>おお</rt></ruby>くて、<ruby>電車<rt>でんしゃ</rt></ruby>もいつも<ruby>込<rt>こ</rt></ruby>んでいました。でも、<ruby>遊<rt>あそ</rt></ruby>ぶところが<ruby>多<rt>おお</rt></ruby>くて、とてもおもしろかったです。<br><br><ruby>今<rt>いま</rt></ruby>は、<ruby>北海道<rt>ほっかいどう</rt></ruby>の<ruby>小<rt>ちい</rt></ruby>さな<ruby>町<rt>まち</rt></ruby>で<ruby>働<rt>はたら</rt></ruby>いています。<ruby>冬<rt>ふゆ</rt></ruby>は<ruby>雪<rt>ゆき</rt></ruby>がたくさん<ruby>降<rt>ふ</rt></ruby>って<ruby>寒<rt>さむ</rt></ruby>いです。でも、<ruby>自然<rt>しぜん</rt></ruby>がきれいで、<ruby>食<rt>た</rt></ruby>べ<ruby>物<rt>もの</rt></ruby>もおいしいです。<ruby>来年<rt>らいねん</rt></ruby>、<ruby>東京<rt>とうきょう</rt></ruby>から<ruby>友<rt>とも</rt></ruby>だちが<ruby>遊<rt>あそ</rt></ruby>びに<ruby>来<rt>き</rt></ruby>ます。<ruby>友<rt>とも</rt></ruby>だちはスキーが<ruby>好<rt>す</rt></ruby>きですから、<ruby>一緒<rt>いっしょ</rt></ruby>に<ruby>山<rt>やま</rt></ruby>へ<ruby>行<rt>い</rt></ruby>くつもりです。", "vocab": [{"word": "込む (こむ)", "en": "to get crowded", "si": "තදබද වෙනවා"}, {"word": "自然 (しぜん)", "en": "nature", "si": "ස්වභාවධර්මය"}], "question": "<ruby>私<rt>わたし</rt></ruby>は、<ruby>今<rt>いま</rt></ruby>どうして<ruby>北海道<rt>ほっかいどう</rt></ruby>に<ruby>住<rt>す</rt></ruby>んでいますか。", "options": ["1. <ruby>雪<rt>ゆき</rt></ruby>が<ruby>好<rt>す</rt></ruby>きだからです。", "2. <ruby>北海道<rt>ほっかいどう</rt></ruby>で<ruby>仕事<rt>しごと</rt></ruby>をしているからです。", "3. <ruby>東京<rt>とうきょう</rt></ruby>の<ruby>電車<rt>でんしゃ</rt></ruby>が<ruby>込<rt>こ</rt></ruby>んでいたからです。", "4. <ruby>食<rt>た</rt></ruby>べ<ruby>物<rt>もの</rt></ruby>がおいしいからです。"], "correct": 1, "tip_en": "<strong>Teacher's Tip: Paraphrasing!</strong><br>'働いています' (working) is rephrased as '仕事をしている' (doing work) in option 2.", "tip_si": "<strong>ගුරුවරයාගේ ඉඟිය: සමාන අර්ථ ඇති වචන!</strong><br>'働いています' (වැඩ කරනවා) යන්න 2 වන පිළිතුරේ '仕事をしている' (රැකියාවක් කරනවා) ලෙස වෙනස් කර ඇත."}, {"id": 2, "category": "short", "category_name": "短文 (Short Passage)", "passage": "フリーマーケットを<ruby>知<rt>し</rt></ruby>っていますか。フリーマーケットは<ruby>公園<rt>こうえん</rt></ruby>などで、いろいろな<ruby>人<rt>ひと</rt></ruby>が<ruby>開<rt>ひら</rt></ruby>くお<ruby>店<rt>みせ</rt></ruby>です。<ruby>子<rt>こ</rt></ruby>どもの<ruby>服<rt>ふく</rt></ruby>は、<ruby>今年<rt>ことし</rt></ruby><ruby>着<rt>き</rt></ruby>た<ruby>服<rt>ふく</rt></ruby>でも<ruby>来年<rt>らいねん</rt></ruby><ruby>着<rt>き</rt></ruby>ません。だから<ruby>売<rt>う</rt></ruby>る<ruby>人<rt>ひと</rt></ruby>がたくさんいます。<br><br><ruby>私<rt>わたし</rt></ruby>もときどきお<ruby>店<rt>みせ</rt></ruby>を<ruby>出<rt>だ</rt></ruby>します。<ruby>着<rt>き</rt></ruby>ない<ruby>服<rt>ふく</rt></ruby>などをすてるのが<ruby>好<rt>す</rt></ruby>きではないので、フリーマーケットはとてもいいと<ruby>思<rt>おも</rt></ruby>います。", "vocab": [{"word": "フリーマーケット", "en": "flea market", "si": "මැක්කන්ගේ වෙළඳපොළ"}, {"word": "すてる", "en": "to throw away", "si": "විසි කරනවා"}], "question": "「<ruby>私<rt>わたし</rt></ruby>」はどうしてフリーマーケットでお<ruby>店<rt>みせ</rt></ruby>を<ruby>出<rt>だ</rt></ruby>しますか。", "options": ["1. フリーマーケットは<ruby>安<rt>やす</rt></ruby>いからです。", "2. あまりお<ruby>金<rt>かね</rt></ruby>がないからです。", "3. <ruby>使<rt>つか</rt></ruby>わないものをすてるのがきらいだからです。", "4. きれいな<ruby>服<rt>ふく</rt></ruby>がたくさんあるからです。"], "correct": 2, "tip_en": "<strong>Teacher's Tip: Negative match!</strong><br>'すてるのが好きではない' matches 'すてるのがきらい' in option 3.", "tip_si": "<strong>ගුරුවරයාගේ ඉඟිය: සෘණාත්මක අර්ථ!</strong><br>'すてるのが好きではない' (අයින් කිරීමට නොකැමතියි) යන්න 3 වන පිළිතුරේ 'すてるのがきらい' ට සමාන වේ."}, {"id": 3, "category": "short", "category_name": "短文 (Short Passage)", "passage": "<ruby>私<rt>わたし</rt></ruby>の<ruby>家<rt>いえ</rt></ruby>の<ruby>庭<rt>にわ</rt></ruby>に、<ruby>赤<rt>あか</rt></ruby>い<ruby>実<rt>み</rt></ruby>をつける<ruby>木<rt>き</rt></ruby>があります。きれいな<ruby>色<rt>いろ</rt></ruby>ですが、<ruby>鳥<rt>とり</rt></ruby>は<ruby>食<rt>た</rt></ruby>べません。だから、たぶんおいしくありません。<br><br><ruby>先週<rt>せんしゅう</rt></ruby>、<ruby>友<rt>とも</rt></ruby>だちが<ruby>来<rt>き</rt></ruby>たとき、<ruby>実<rt>み</rt></ruby>を<ruby>食<rt>た</rt></ruby>べました。「おいしいよ。」<ruby>私<rt>わたし</rt></ruby>はおどろいて一つ<ruby>食<rt>た</rt></ruby>べました。甘くておいしかったです。", "vocab": [{"word": "実をつける", "en": "to bear fruit", "si": "ගෙඩි හටගන්නවා"}, {"word": "おどろく", "en": "to be surprised", "si": "පුදුම වෙනවා"}], "question": "どうして「たぶん、その<ruby>実<rt>み</rt></ruby>はおいしくありません」と<ruby>思<rt>おも</rt></ruby>いましたか。", "options": ["1. 自分<ruby>が<rt></rt></ruby><ruby>食<rt>た</rt></ruby>べてまずかったからです。", "2. 友達がまずいと言ったからです。", "3. その<ruby>実<rt>み</rt></ruby>を<ruby>鳥<rt>とり</rt></ruby>が<ruby>食<rt>た</rt></ruby>べないからです。", "4. 赤い色はまずい色だからです。"], "correct": 2, "tip_en": "<strong>Teacher's Tip: Reason Connector!</strong><br>'鳥は食べません。だから、たぶん...' Shows birds not eating is the reason (Option 3).", "tip_si": "<strong>ගුරුවරයාගේ ඉඟිය: හේතුව!</strong><br>'鳥は食べません。だから' කුරුල්ලන් නොකෑම හේතුව බව ပෙන්වයි."}, {"id": 4, "category": "short", "category_name": "短文 (Short Passage)", "passage": "<ruby>今日<rt>きょう</rt></ruby>は<ruby>朝<rt>あさ</rt></ruby><ruby>寒<rt>さむ</rt></ruby>かったから、セーターを2<ruby>枚<rt>まい</rt></ruby><ruby>着<rt>き</rt></ruby>て<ruby>出<rt>で</rt></ruby>かけました。<ruby>午後<rt>ごご</rt></ruby>とてもあつくなったので、<ruby>映画館<rt>えいがかん</rt></ruby>でセーターをぬぎました。<ruby>帰<rt>かえ</rt></ruby>るときセーターをわすれて<ruby>帰<rt>かえ</rt></ruby>りました。<ruby>母<rt>はは</rt></ruby>にもらったものだから、とてもざんねんです。<ruby>明日<rt>あした</rt></ruby>からは<ruby>天気予報<rt>てんきよほう</rt></ruby>を見てから<ruby>出<rt>で</rt></ruby>かけます。", "vocab": [{"word": "ぬぐ", "en": "to take off clothes", "si": "ඇඳුම් ගලවනවා"}, {"word": "ざんねん", "en": "regretful / pity", "si": "කණගාටුදායකයි"}], "question": "<ruby>今日<rt>きょう</rt></ruby>「<ruby>私<rt>わたし</rt></ruby>」がしなかったのは<ruby>何<rt>なん</rt></ruby>ですか。", "options": ["1. 映画を見ること", "2. セーターをぬぐこと", "3. 映画館に電話すること", "4. 天気予報を見ること"], "correct": 3, "tip_en": "<strong>Teacher's Tip: Time marker!</strong><br>'明日からは天気予報を見て...' means weather was NOT checked today (Option 4).", "tip_si": "<strong>ගුරුවරයාගේ ඉඟිය: කාලය!</strong><br>'明日からは...' (හෙට සිට) කී බැවින් අද කාලගුණය බලා නැත."}, {"id": 5, "category": "short", "category_name": "短文 (Short Passage)", "passage": "<ruby>私<rt>わたし</rt></ruby>はしごとで、<ruby>日本<rt>にほん</rt></ruby>のあちらこちらに<ruby>行<rt>い</rt></ruby>きます。<ruby>行<rt>い< tired", "si": "වහෙස වෙනවා"}], "question": "この人は どうして アパートに 引っ越しますか。", "options": ["1. 電車代が高いから", "2. 朝の電車が込んでいて疲れるから", "3. 自転車を買ったから", "4. 大学が遠くなったから"], "correct": 1, "tip_en": "<strong>Teacher's Tip: Find 'だから'!</strong><br>'朝の電車はとても込んでいて疲れます。だから...' directly links fatigue/crowding to moving (Option 2).", "tip_si": "<strong>ගුරුවරයාගේ ඉඟිය: 'だから' පදය!</strong><br>'疲れます。だから...' යන්නෙන් වෙහෙස වීම පදිංචිය වෙනස් කිරීමට හේතුව බව පෙන්වයි."}, {"id": 12, "category": "short", "category_name": "短文 (Short Passage)", "passage": "<ruby>会社<rt>かいしゃ</rt></ruby>の近くに 新しいレストランができました。安くておいしいと評判なので、昨日 <ruby>同僚<rt>どうりょう</rt></ruby>と一緒に行きました。ランチセットは800円で、スープとサラダもついていました。とても満足したので、また来週も行きたいです。", "vocab": [{"word": "評判 (ひょうばん)", "en": "reputation / popular", "si": "ප්‍රසිද්ධිය / කීර්තිය"}, {"word": "満足 (まんぞく)", "en": "satisfied", "si": "තෘප්තිමත්"}], "question": "この人は レストランについて どう思いましたか。", "options": ["1. 高かったが おいしかった", "2. 安くて スープもついていて 満足した", "3. 混んでいたので もう行きたくない", "4. 同僚が払ってくれたので よかった"], "correct": 1, "tip_en": "<strong>Teacher's Tip: Keyword '満足'!</strong><br>The narrator was satisfied with the 800 yen set including soup and salad (Option 2).", "tip_si": "<strong>ගුරුවරයාගේ ඉඟිය: '満足' වචනය!</strong><br>800円 සෙට් එකට සූප් සහ සලද තිබූ නිසා තෘප්තිමත් විය."}, {"id": 13, "category": "short", "category_name": "短文 (Short Passage)", "passage": "<ruby>私<rt>わたし</rt></ruby>は<ruby>先月<rt>せんげつ</rt></ruby>からギターを習い始めました。<ruby>子供<rt>こども</rt></ruby>のころから 音楽が好きでしたが、楽器を弾くのは初めてです。<ruby>毎日<rt>まいにち</rt></ruby>仕事が終わってから、家で30分練習しています。少しずつ上手になって、好きな曲が弾けるようになって嬉しいです。", "vocab": [{"word": "習う (ならう)", "en": "to learn", "si": "ඉගෙන ගන්නවා"}, {"word": "弾く (ひく)", "en": "to play guitar/piano", "si": "වාදනය කරනවා"}], "question": "この人について、正しいものはどれですか。", "options": ["1. 子供のときから ギターを弾いていた", "2. 毎日 会社で ギターを練習している", "3. 先月から ギターを習い始めた", "4. まだ 好きな曲が 弾けない"], "correct": 2, "tip_en": "<strong>Teacher's Tip: Check start date!</strong><br>'先月からギターを習い始めました' directly matches Option 3.", "tip_si": "<strong>ගුරුවරයාගේ ඉඟිය: ආරම්භ කළ දිනය!</strong><br>'先月から...' (පසුගිය මාසයේ සිට) කියා කෙලින්ම ඇත."}, {"id": 14, "category": "short", "category_name": "短文 (Short Passage)", "passage": "<ruby>図書館<rt>としょかん</rt></ruby>は<ruby>月曜日<rt>げつようび</rt></ruby>が休みです。でも、<ruby>月曜日<rt>げつようび</rt></ruby>が<ruby>祝日<rt>しゅくじつ</rt></ruby>のときは開いています。そのかわり、<ruby>火曜日<rt>かようび</rt></ruby>が休みになります。<ruby>私<rt>わたし</rt></ruby>は毎週 <ruby>本<rt>ほん</rt></ruby>を借りに行きますが、今週の月曜日は祝日だったので、火曜日に行きました。", "vocab": [{"word": "祝日 (しゅくじつ)", "en": "national holiday", "si": "ජාතික නිවාඩු දිනය"}, {"word": "そのかわり", "en": "instead", "si": "ඊට වෙනුවට"}], "question": "今週、図書館は いつ 休みでしたか。", "options": ["1. 月曜日", "2. 火曜日", "3. 水曜日", "4. 休みはなかった"], "correct": 1, "tip_en": "<strong>Teacher's Tip: Exception Switch!</strong><br>Monday was a holiday -> Tuesday became closed day instead (Option 2).", "tip_si": "<strong>ගුරුවරයාගේ ඉඟිය: ව්‍යතිරේක නීතිය!</strong><br>සඳුදා නිවාඩු දිනයක් වූ බැවින් අඟහරුවාදා වසා තබන ලදී."}, {"id": 15, "category": "short", "category_name": "短文 (Short Passage)", "passage": "<ruby>昨日<rt>きのう</rt></ruby>の夕方、飼っている猫がいなくなりました。<ruby>家族<rt>かぞく</rt></ruby>で近くの公園や道路を探しましたが見つかりませんでした。<ruby>夜<rt>よる</rt></ruby>になってあきらめて家に入ろうとしたとき、玄関の横で眠っている猫を見つけました。無事で安心しました。", "vocab": [{"word": "探す (さがす)", "en": "to look for", "si": "සොයනවා"}, {"word": "無事 (ぶじ)", "en": "safe and sound", "si": "ආරක්ෂිතව"}], "question": "猫は どこに いましたか。", "options": ["1. 公園の 中", "2. 道路の 上", "3. 玄関の 横", "4. 家の 部屋の中"], "correct": 2, "tip_en": "<strong>Teacher's Tip: Exact Location Scan!</strong><br>'玄関の横で眠っている猫を見つけました' matches Option 3.", "tip_si": "<strong>ගුරුවරයාගේ ඉඟිය: ස්ථානය සොයන්න!</strong><br>'玄関の横' (ඉදිරිපස දොර අසල) කියා කෙලින්ම ඇත."}, {"id": 16, "category": "short", "category_name": "短文 (Short Passage)", "passage": "<ruby>来週<rt>らいしゅう</rt></ruby>は母の誕生日です。<ruby>私<rt>わたし</rt></ruby>は赤いスカーフをプレゼントしようと思っています。<ruby>母<rt>はは</rt></ruby>はよく散歩をするので、寒い日に使ってほしいです。<ruby>昨日<rt>きのう</rt></ruby>デパートで綺麗なスカーフを見つけたので、明日買いに行きます。", "vocab": [{"word": "誕生日 (たんじょうび)", "en": "birthday", "si": "උපන් දිනය"}, {"word": "スカーフ", "en": "scarf", "si": "ස්කාෆ් එක"}], "question": "この人は どうして スカーフを選びましたか。", "options": ["1. 母が スカーフを欲しがっていたから", "2. 母が よく散歩をして 寒い日に使ってほしいから", "3. 安く 買えたから", "4. 母の 好きな色が 黒だから"], "correct": 1, "tip_en": "<strong>Teacher's Tip: Intent Marker '〜てほしい'!</strong><br>'母はよく散歩をするので、寒い日に使ってほしい' gives Option 2.", "tip_si": "<strong>ගුරුවරයාගේ ඉඟිය: '〜てほしい' (අපේක්ෂාව)!</strong><br>අම්මා ඇවිදින්න යන නිසා සීතල දිනවල පාවිච්චි කිරීමට (Option 2)."}, {"id": 17, "category": "short", "category_name": "短文 (Short Passage)", "passage": "<ruby>夏休み<rt>なつやすみ</rt></ruby>に沖縄へ行きました。<ruby>飛行機<rt>ひこうき</rt></ruby>に乗るのも沖縄に行くのも初めてでした。<ruby>海<rt>うみ</rt></ruby>が青くてとても美しかったです。3日間泳いだり、おいしい魚を食べたりして最高の時間を過ごしました。また来年も行きたいです。", "vocab": [{"word": "最高 (さいこう)", "en": "awesome / best", "si": "ඉහළම / සුපිරි"}, {"word": "過ごす (すごす)", "en": "to spend time", "si": "කාලය ගත කරනවා"}], "question": "この人について、正しいものはどれですか。", "options": ["1. 沖縄へ行くのは 2回目です", "2. 飛行機に 初めて 乗りました", "3. 泳ぐのが 嫌いでした", "4. 魚を 食べませんでした"], "correct": 1, "tip_en": "<strong>Teacher's Tip: First-time Experience!</strong><br>'飛行機に乗るのも...初めてでした' confirms Option 2.", "tip_si": "<strong>ගුරුවරයාගේ ඉඟිය: '初めて' (පළමු වතාව)!</strong><br>ගුවන් යානයට නැඟුණු පළමු වතාව වේ."}, {"id": 18, "category": "short", "category_name": "短文 (Short Passage)", "passage": "<ruby>私<rt>わたし</rt></ruby>はアニメを見て日本語を勉強しています。教科書の勉強は少し難しいですが、アニメの言葉は分かりやすくて面白いです。好きなキャラクターのセリフをノートに書いて、毎日覚えて練習しています。", "vocab": [{"word": "教科書 (きょうかしょ)", "en": "textbook", "si": "පැවරුම් පොත / පෙළපොත"}, {"word": "セリフ", "en": "anime lines / quotes", "si": "දෙබස්"}], "question": "この人は どうやって 日本語を 勉強していますか。", "options": ["1. 教科書だけを使って 勉強している", "2. アニメのセリフを ノートに書いて 練習している", "3. 毎日 友達と 日本語で 話している", "4. 日本の 歌を 歌っている"], "correct": 1, "tip_en": "<strong>Teacher's Tip: Specific Action Scan!</strong><br>'セリフをノートに書いて、毎日覚えて練習しています' = Option 2.", "tip_si": "<strong>ගුරුවරයාගේ ඉඟිය: නිශ්චිත ක්‍රියාව!</strong><br>ඇනිමේ දෙබස් නෝට්බුක් එකේ ලියා පුහුණු වේ."}, {"id": 19, "category": "short", "category_name": "短文 (Short Passage)", "passage": "<ruby>夏<rt>なつ</rt></ruby>になると部屋がとても暑くなります。うちにはエアコンがなくて、扇風機しかありませんでした。でも、昨日その扇風機が壊れてしまいました。とても暑くて寝られなかったので、今日電気屋へ行ってエアコンを買いました。", "vocab": [{"word": "扇風機 (せんぷうき)", "en": "electric fan", "si": "විදුලි පංකාව"}, {"word": "壊れる (こわれる)", "en": "to break down", "si": "කඩනවා / කැඩෙනවා"}], "question": "この人は 今日 どうして エアコンを 買いましたか。", "options": ["1. 扇風機が 壊れて 暑くて寝られなかったから", "2. エアコンが 安く 売っていたから", "3. 扇風機より エアコンが 好きだから", "4. 友達に エアコンを もらったから"], "correct": 0, "tip_en": "<strong>Teacher's Tip: Cause & Effect Sequence!</strong><br>Fan broke -> Couldn't sleep -> Bought AC today (Option 1).", "tip_si": "<strong>ගුරුවරයාගේ ඉඟිය: හේතුව සහ ඵලය!</strong><br>ෆෑන් එක කැඩී නිදා ගැනීමට නොහැකි වූ නිසා AC එකක් මිලදී ගත්තේය."}, {"id": 20, "category": "short", "category_name": "短文 (Short Passage)", "passage": "<ruby>駅<rt>えき</rt></ruby>の近くに小さなカフェがあります。クラシック音楽が流れていて、とても静かで落ち着く場所です。<ruby>私<rt>わたし</rt></ruby>は週末の午後、いつもそこで本を読みながらコーヒーを飲みます。自分だけの特別な時間です。", "vocab": [{"word": "流れる (ながれる)", "en": "to play (music) / flow", "si": "වාදනය වෙනවා / ගලනවා"}, {"word": "落ち着く (おちつく)", "en": "relaxing / calming", "si": "සන්සුන් වෙනවා"}], "question": "この人は 週末の午後 カフェで 何をしますか。", "options": ["1. 友達と おしゃべりをする", "2. コーヒーを飲みながら 本を読む", "3. ピアノの 練習をする", "4. 勉強を 教える"], "correct": 1, "tip_en": "<strong>Teacher's Tip: Simultaneous action '〜ながら'!</strong><br>'コーヒーを飲みながら本を読みます' = Option 2.", "tip_si": "<strong>ගුරුවරයාගේ ඉඟිය: '〜ながら' (එකවර කරන ක්‍රියා)!</strong><br>කෝපි බොමින් පොත් කියවයි."}, {"id": 21, "category": "medium", "category_name": "中文・メール (Medium / Email)", "passage": "<strong>【まりさんから カクさんへのメール】</strong><br><br>カクさん、<ruby>勉強会<rt>べんきょうかい</rt></ruby>を いつ しましょうか。<br><ruby>来週<rt>らいしゅう</rt></ruby>、<ruby>月曜日<rt>げつようび</rt></ruby>の<ruby>午前中<rt>ごぜんちゅう</rt></ruby>は<ruby>時間<rt>じかん</rt></ruby>がありますが、<ruby>午後<rt>ごご</rt></ruby>は いそがしいです。<ruby>火曜日<rt>かようび</rt></ruby>は<ruby>午後<rt>ごご</rt></ruby> 会議がありますが、3<ruby>時<rt>じ</rt></ruby>に終わります。<ruby>水曜日<rt>すいようび</rt></ruby>と<ruby>木曜日<rt>もくようび</rt></ruby>は 東京にいません。<ruby>金曜日<rt>きんようび</rt></ruby>は 一日 だいじょうぶです。カクさんは どうですか。", "vocab": [{"word": "午前中 (ごぜんちゅう)", "en": "morning time", "si": "උදෑසන කාලය"}, {"word": "会議 (かいぎ)", "en": "meeting", "si": "රැස්වීම"}], "question": "カクさんと まりさんは <ruby>来週<rt>らいしゅう</rt></ruby> 毎日 <ruby>午前中<rt>ごぜんちゅう</rt></ruby> いそがしいです。いつ <ruby>勉強会<rt>べんきょうかい</rt></ruby>が できますか。", "options": ["1. 月曜日か 火曜日の 午後", "2. 月曜日か 金曜日の 午後", "3. 火曜日か 金曜日の 午後", "4. 水曜日か 木曜日の 午後"], "correct": 2, "tip_en": "<strong>Teacher's Tip: Schedule Intersection!</strong><br>Since morning is busy: Tue after 3PM & Fri all day are free (Option 3).", "tip_si": "<strong>ගුරුවරයාගේ ඉඟිය: කාලසටහන් ගැලපීම!</strong><br>උදේ බිසී නිසා: අඟහරුවාදා සවස 3න් පසු සහ සිකුරාදා සවස පුළුවන්."}, {"id": 22, "category": "medium", "category_name": "中文・メール (Medium / Email)", "passage": "（上のメールを読んで答えてください）<br>まりさんは <ruby>水曜日<rt>すいようび</rt></ruby>と <ruby>木曜日<rt>もくようび</rt></ruby>、どうして <ruby>勉強会<rt>べんきょうかい</rt></ruby>が できませんか。", "vocab": [{"word": "東京にいません", "en": "Not in Tokyo", "si": "තෝකියෝ හි නැත"}], "question": "まりさんは 水曜日と 木曜日、どうして 勉強会が できませんか。", "options": ["1. 会議があるから", "2. 東京にいないから", "3. アルバイトがあるから", "4. 友達が来るから"], "correct": 1, "tip_en": "<strong>Teacher's Tip: Direct Reason Match!</strong><br>'水曜日と木曜日は東京にいません' -> Option 2.", "tip_si": "<strong>ගුරුවරයාගේ ඉඟිය: කෙලින්ම ඇති හේතුව!</strong><br>'東京にいません' (තෝකියෝවේ නැත) කියා ඇත."}, {"id": 23, "category": "medium", "category_name": "中文・メール (Medium / Email)", "passage": "先週の土曜日、私は友達のキムさんと一緒に京都へ行きました。京都までは新幹線で約1時間かかりました。着いてから、まず有名なお寺を見に行きました。古い建物がたくさんあって、とても静かでした。<br><br>昼ごはんは、お寺の近くの店で和食を食べました。少し高かったですが、とてもおいしかったです。午後はバスで大きな公園へ行きました。桜の花が咲いていて、写真をたくさん撮りました。", "vocab": [{"word": "新幹線 (しんかんせん)", "en": "bullet train", "si": "අතිවේගී දුම්රිය"}, {"word": "和食 (わしょく)", "en": "Japanese food", "si": "ජපන් කෑම"}], "question": "京都で 最初に 何をしましたか。", "options": ["1. 昼ごはんを食べた", "2. 公園で写真を撮った", "3. 有名なお寺を見に行った", "4. バスに乗った"], "correct": 2, "tip_en": "<strong>Teacher's Tip: Keyword 'まず'!</strong><br>'まず有名なお寺を見に行きました' -> Option 3.", タイム会員", "2. デイ会員", "3. ナイト会員", "4. ホリデー会員"], "correct": 2, "tip_en": "<strong>Teacher's Tip: Time slot matching!</strong><br>Weekday evening (19:00-21:00) falls under '平日 17:00〜22:00' = ナイト会員 (7,000円) -> Option 3.", "tip_si": "<strong>ගුරුවරයාගේ ඉඟිය: වේලාව බලන්න!</strong><br>සති දින රාත්‍රී (19:00-21:00) යනු '平日 17:00〜22:00' (ナイト会員) වේ."}, {"id": 58, "category": "info", "category_name": "情報検索 (Info Search)", "passage": "<strong>【コンサート チケット案内】</strong><br>日時：12月25日（水）開場 17:30 / 開演 18:30<br>料金：指定席 6,000円 / 自由席 4,500円<br>【購入方法】<br>・WEB購入：クレジットカード決済（手数料 無料）<br>・コンビニ購入：レジで現金支払い（手数料 1枚につき200円）", "vocab": [{"word": "開場 (かいじょう)", "en": "doors open", "si": "දොරවල් විවෘත කිරීම"}, {"word": "開演 (かいえん)", "en": "performance starts", "si": "ප්‍රදර්ශනය ආරම්භය"}], "question": "自由席の チケットを コンビニで 2枚 買います。合計で いくら 払いますか。", "options": ["1. 9,000円", "2. 9,400円", "3. 12,000円", "4. 12,400円"], "correct": 1, "tip_en": "<strong>Teacher's Tip: Ticket + Service Fee Sum!</strong><br>Unreserved ticket (自由席) = 4,500円 x 2 = 9,000円. Convenience fee = 200円 x 2 = 400円. Total = 9,400円 (Option 2).", "tip_si": "<strong>ගුරුවරයාගේ ඉඟිය: ටිකට් + සේවා ගාස්තුව!</strong><br>ටිකට් 4,500円 x 2 = 9,000円. සේවා ගාස්තුව 200円 x 2 = 400円. එකතුව 9,400円."}, {"id": 59, "category": "info", "category_name": "情報検索 (Info Search)", "passage": "<strong>【休日 診療（しんりょう）クリニック】</strong><br>日曜・祝日 応急診療（9:00〜17:00）<br>※受付は 16:30までです。<br>※必ず 保険証（ほけんしょう）を 持参してください。現金のみ対応。<br>※熱が 38.5度以上ある方は、事前に 電話でお知らせください。", "vocab": [{"word": "診療 (しんりょう)", "en": "medical care / clinic", "si": "වෛද්‍ය ප්‍රතිකාර"}, {"word": "持参 (じさん)", "en": "bring along", "si": "රැගෙන ඒම"}], "question": "日曜日の 午後4時に 診療所へ 行くとき、注意しなければならないことは 何ですか。", "options": ["1. クレジットカードで 払わなければならない", "2. 保険証を 持っていかなければならない", "3. 受付は 午後5時までできる", "4. 事前予約が 必要である"], "correct": 1, "tip_en": "<strong>Teacher's Tip: Requirement Scan '必ず'!</strong><br>'必ず 保険証を 持参してください' -> Option 2.", "tip_si": "<strong>ගුරුවරයාගේ ඉඟිය: '必ず' (අනිවාර්යයෙන්ම)!</strong><br>අනිවාර්යයෙන්ම රක්ෂණ කාඩ්පත (保険証) ගෙන යා යුතුය."}, {"id": 60, "category": "info", "category_name": "情報検索 (Info Search)", "passage": "<strong>【ホテル 朝食バイキング案内】</strong><br>営業時間：6:30〜10:00（最終入場 9:30）<br>料金：大人（中学生以上）2,200円 / 小学生 1,100円 / 6歳未満 無料<br>※宿泊者以外の方も ご利用いただけます。", "vocab": [{"word": "バイキング", "en": "buffet", "si": "බුෆේ කෑම"}, {"word": "未満 (みまん)", "en": "under age", "si": "අඩු වයස්"}], "question": "ホテルに 泊まっていない 人が、8時に 5才の子どもと 一緒に 朝食を食べます。いくらですか。", "options": ["1. 無料", "2. 1,100円", "3. 2,200円", "4. 3,300円"], "correct": 2, "tip_en": "<strong>Teacher's Tip: Under-6 Free Rule & Non-guest allowance!</strong><br>Non-guests ARE allowed. Adult = 2,200円. Child (5yo, under 6) = FREE! Total = 2,200円 (Option 3).", "tip_si": "<strong>ගුරුවරයාගේ ඉඟිය: අවුරුදු 6ට අඩු නිදහස්!</strong><br>හෝටලයේ නැවතී නැති අයටද පුළුවන්. වැඩිහිටි 2,200円 + අවු. 5 ළමයා නොමිලේ = 2,200円."}];
    let userAnswers = {};

    function renderApp() {
        const jumpContainer = document.getElementById('jump-buttons-container');
        const qWrapper = document.getElementById('questions-wrapper');
        
        jumpContainer.innerHTML = '';
        qWrapper.innerHTML = '';
        
        questionsData.forEach((q) => {
            const jBtn = document.createElement('div');
            jBtn.className = 'jump-btn';
            jBtn.id = 'jump-btn-' + q.id;
            jBtn.innerText = q.id;
            jBtn.onclick = () => {
                document.getElementById('q-card-' + q.id).scrollIntoView({ behavior: 'smooth', block: 'center' });
            };
            jumpContainer.appendChild(jBtn);
            
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = 'q-card-' + q.id;
            card.setAttribute('data-category', q.category);
            
            let vocabHtml = '';
            if(q.vocab && q.vocab.length > 0) {
                vocabHtml = `
                    <div class="vocab-box">
                        <h5>📚 単語・表現 (Vocabulary & Key Phrases)</h5>
                        <ul>
                            ` + q.vocab.map(v => `<li><strong>` + v.word + `</strong>: ` + v.en + ` / ` + v.si + `</li>`).join('') + `
                        </ul>
                    </div>
                `;
            }
            
            let optionsHtml = q.options.map((opt, optIdx) => `
                <li onclick="selectOption(` + q.id + `, ` + optIdx + `, ` + q.correct + `)">` + opt + `</li>
            `).join('');
            
            card.innerHTML = `
                <div class="question-header">
                    <span class="q-badge">Q` + q.id + `</span>
                    <span class="cat-tag">` + q.category_name + `</span>
                </div>
                <div class="passage-box">` + q.passage + `</div>
                ` + vocabHtml + `
                <div class="q-text">` + q.question + `</div>
                <ul class="options-list" id="opts-q-` + q.id + `">
                    ` + optionsHtml + `
                </ul>
                <button class="expl-btn" onclick="toggleExpl(` + q.id + `)">💡 解説とテクニック (Explanation)</button>
                <div class="expl-box" id="expl-box-` + q.id + `">
                    <div class="lang-tabs">
                        <button class="tab-btn active" onclick="switchLang(` + q.id + `, 'en')">🇬🇧 English</button>
                        <button class="tab-btn" onclick="switchLang(` + q.id + `, 'si')">🇱🇰 Sinhala</button>
                    </div>
                    <div class="tab-content active" id="expl-en-` + q.id + `">
                        <div class="tip-card">` + q.tip_en + `</div>
                    </div>
                    <div class="tab-content" id="expl-si-` + q.id + `">
                        <div class="tip-card">` + q.tip_si + `</div>
                    </div>
                </div>
            `;
            qWrapper.appendChild(card);
        });
    }

    function selectOption(qId, selectedIdx, correctIdx) {
        const optsList = document.getElementById('opts-q-' + qId).children;
        const jumpBtn = document.getElementById('jump-btn-' + qId);
        
        for(let i=0; i<optsList.length; i++) {
            optsList[i].style.borderColor = '#e2e8f0';
            optsList[i].style.background = '#ffffff';
            optsList[i].style.color = '#334155';
            optsList[i].innerText = optsList[i].innerText.replace(' ❌', '').replace(' ✅', '');
        }
        
        if(selectedIdx === correctIdx) {
            optsList[selectedIdx].style.borderColor = '#10b981';
            optsList[selectedIdx].style.background = '#ecfdf5';
            optsList[selectedIdx].style.color = '#065f46';
            optsList[selectedIdx].innerText += ' ✅';
            jumpBtn.className = 'jump-btn correct';
            userAnswers[qId] = true;
        } else {
            optsList[selectedIdx].style.borderColor = '#ef4444';
            optsList[selectedIdx].style.background = '#fef2f2';
            optsList[selectedIdx].style.color = '#991b1b';
            optsList[selectedIdx].innerText += ' ❌';
            jumpBtn.className = 'jump-btn wrong';
            userAnswers[qId] = false;
        }
        
        updateScore();
    }

    function updateScore() {
        const correctCount = Object.values(userAnswers).filter(v => v === true).length;
        document.getElementById('score-counter').innerText = '正解数: ' + correctCount + ' / 60';
    }

    function toggleExpl(qId) {
        const box = document.getElementById('expl-box-' + qId);
        box.classList.toggle('active');
    }

    function switchLang(qId, lang) {
        const box = document.getElementById('expl-box-' + qId);
        box.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        box.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        
        document.getElementById('expl-' + lang + '-' + qId).classList.add('active');
        box.querySelector('button[onclick*="' + lang + '"]').classList.add('active');
    }

    function filterCategory(cat, ev) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        if(ev) ev.target.classList.add('active');
        
        const cards = document.getElementById('questions-wrapper').querySelectorAll('.question-card');
        cards.forEach(card => {
            if(cat === 'all' || card.getAttribute('data-category') === cat) {
                card.style.display = 'block';
            } else {
                card.style.display = 'none';
            }
        });
    }

    renderApp();
</script>
