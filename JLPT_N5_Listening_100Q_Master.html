<script>
    const questionsData = [{"id": 1, "category": "もんだい1", "category_name": "もんだい1 課題理解", "passage": "男の人が女の人と話しています。男の人はジュースに何を入れますか。<br><br>男：すみません、このつめたいジュースに レモンを入れてもらえますか。<br>女：はい、レモンですね。スライスしたレモンですね。<br>男：あ、あと チェリーも一つ乗せてください。アイスクリームはいりません。<br>女：わかりました。少々おまちください。", "vocab": [{"word": "乗せる (のせる)", "en": "to put on top", "si": "උඩින් තබනවා"}, {"word": "スライス", "en": "slice", "si": "පෙති"}], "question": "男の人は ジュースに 何を入れますか。", "options": ["1. レモンと チェリー", "2. レモンと アイスクリーム", "3. チェリーと アイスクリーム", "4. レモンだけ"], "correct": 0, "tip_en": "<strong>👨‍🏫 Prep-School Listening Strategy:</strong><br>\n        <strong>1. Question Goal:</strong> What items does the man want in his juice? (ジュースに何を入れるか)<br>\n        <strong>2. Script Analysis:</strong><br>\n        • \"レモンを入れてもらえますか\" -> Requests Lemon.<br>\n        • \"チェリーも一つ乗せてください\" -> Requests Cherry.<br>\n        • \"アイスクリームはいりません\" -> Refuses Ice Cream.<br>\n        <strong>3. Conclusion:</strong> Lemon + Cherry = Option 1.<br>\n        <strong>4. Listening Key:</strong> Watch out for negations like \"はいりません\" (don't need)!", "tip_si": "<strong>👨‍🏫 ගුරුවරයාගේ ප්‍රගුණ පන්ති විග්‍රහය:</strong><br>\n        <strong>1. ප්‍රශ්නයේ අරමුණ:</strong> පිරිමි පුද්ගලයා බීම එකට එකතු කිරීමට ඉල්ලන්නේ මොනවාද?<br>\n        <strong>2. දෙබසට සවන් දීම:</strong><br>\n        • \"レモンを入れて\" -> දෙහි ඉල්ලයි.<br>\n        • \"チェリーも乗せて\" -> චෙරි ඉල්ලයි.<br>\n        • \"アイスクリームはいりません\" -> අයිස්ක්‍රීම් එපා යැයි පවසයි.<br>\n        <strong>3. පිළිතුර:</strong> දෙහි + චෙරි = 1 වන පිළිතුර.<br>\n        <strong>4. සවන්දීමේ ඉඟිය:</strong> \"いりません\" (අවශ්‍ය නැත) වැනි සෘණාත්මක වචන ගැන අවධානය යොමු කරන්න!"}, {"id": 2, "category": "もんだい1", "category_name": "もんだい1 課題理解", "passage": "店の人と 女の人が 話しています。女の人は いくら 払いますか。<br><br>女：すみません、この カバンは いくらですか。<br>男：それは 1,000円ですが、今日は バーゲンですから 2割引（20%引き）になりますよ。<br>女：あ、そうですか。じゃあ、これを 買います。", "vocab": [{"word": "2割引 (にわりびき)", "en": "20% discount", "si": "20% වට්ටම"}, {"word": "払う (はらう)", "en": "to pay", "si": "මුදල් ගෙවනවා"}], "question": "女の人は いくら 払いますか。", "options": ["1. 1,000<ruby>円<rt>えん</rt></ruby>", "2. 800<ruby>円<rt>えん</rt></ruby>", "3. 200<ruby>円<rt>えん</rt></ruby>", "4. 820<ruby>円<rt>えん</rt></ruby>"], "correct": 1, "tip_en": "<strong>👨‍🏫 Prep-School Listening Strategy:</strong><br>\n        <strong>1. Question Goal:</strong> Calculate final payment amount after discount.<br>\n        <strong>2. Script Calculation:</strong> Original price = 1,000円. Discount = 2割 (20% off = 200円 off).<br>\n        <strong>3. Math:</strong> 1,000円 - 200円 = 800円.<br>\n        <strong>4. Conclusion:</strong> Option 2 (800円) is the exact payment amount!", "tip_si": "<strong>👨‍🏫 ගුරුවරයාගේ ප්‍රගුණ පන්ති විග්‍රහය:</strong><br>\n        <strong>1. ප්‍රශ්නයේ අරමුණ:</strong> වට්ටමෙන් පසු ගෙවිය යුතු අවසාන මුදල කොපමණද?<br>\n        <strong>2. ගණනය කිරීම:</strong> මුල් මිල = 1,000円. වට්ටම = 2割 (20% වට්ටම = 200円 අඩු වේ).<br>\n        <strong>3. එකතුව:</strong> 1,000円 - 200円 = 800円.<br>\n        <strong>4. පිළිතුර:</strong> 2 වන පිළිතුර (800円) නිවැරදියි!"}, {"id": 3, "category": "もんだい1", "category_name": "もんだい1 課題理解", "passage": "男の人と 女の人が 話しています。女の人は このあと まず 何をしますか。<br><br>男：会議室の 準備を お願いします。テーブルの上に パソコンを 並べてください。<br>女：はい、わかりました。窓も 開けましょうか。<br>男：あ、窓は 部屋が 暖かくなってからで いいです。まず 資料を 配ってください。<br>女：わかりました。すぐ やります。", "vocab": [{"word": "まず", "en": "first of all", "si": "පළමුවෙන්ම"}, {"word": "配る (くばる)", "en": "to hand out / distribute", "si": "බෙදා හරිනවා"}], "question": "女の人は このあと まず 何をしますか。", "options": ["1. パソコンを 並べる", "2. 窓を 開ける", "3. 資料を 配る", "4. 部屋を 暖かくする"], "correct": 2, "tip_en": "<strong>👨‍🏫 Prep-School Listening Strategy:</strong><br>\n        <strong>1. Sequence Keyword 'まず':</strong> The question asks what she will do FIRST (まず何をするか).<br>\n        <strong>2. Direct Order in Script:</strong> The man says: \"まず 資料を 配ってください\" (First, please distribute the handouts).<br>\n        <strong>3. Conclusion:</strong> Option 3 is the immediate first task!", "tip_si": "<strong>👨‍🏫 ගුරුවරයාගේ ප්‍රගුණ පන්ති විග්‍රහය:</strong><br>\n     let userAnswers = {};

    function playAudioScript(htmlText) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            // Clean HTML tags and furigana ruby rt tags
            let textToRead = htmlText.replace(/<rt>[^<]*<\/rt>/g, '').replace(/<[^>]*>/g, '');
            let utterance = new SpeechSynthesisUtterance(textToRead);
            utterance.lang = 'ja-JP';
            utterance.rate = 0.82; // Suitable N5 listening speed
            window.speechSynthesis.speak(utterance);
        } else {
            alert('お使いのブラウザは音声読み上げに対応していません。');
        }
    }

    function renderApp() {
        const jumpContainer = document.getElementById('jump-buttons-container');
        const qWrapper = document.getElementById('questions-wrapper');
        
        jumpContainer.innerHTML = '';
        qWrapper.innerHTML = '';
        
        questionsData.forEach((q) => {
            const jBtn = document.createElement('div');
            jBtn.className = 'jump-btn';
            jBtn.id = 'jump-btn-' + q.id;
            jBtn.innerText = q.id;
            jBtn.onclick = () => {
                document.getElementById('q-card-' + q.id).scrollIntoView({ behavior: 'smooth', block: 'center' });
            };
            jumpContainer.appendChild(jBtn);
            
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = 'q-card-' + q.id;
            card.setAttribute('data-category', q.category);
            
            let vocabHtml = '';
            if(q.vocab && q.vocab.length > 0) {
                vocabHtml = `
                    <div class="vocab-box">
                        <h5>📚 単語・表現 (Vocabulary & Key Phrases)</h5>
                        <ul>
                            ` + q.vocab.map(v => `<li><strong>` + v.word + `</strong>: ` + v.en + ` / ` + v.si + `</li>`).join('') + `
                        </ul>
                    </div>
                `;
            }
            
            let optionsHtml = q.options.map((opt, optIdx) => `
                <li onclick="selectOption(` + q.id + `, ` + optIdx + `, ` + q.correct + `)">` + opt + `</li>
            `).join('');
            
            card.innerHTML = `
                <div class="question-header">
                    <span class="q-badge">Q` + q.id + `</span>
                    <span class="cat-tag">` + q.category_name + `</span>
                </div>
                <div class="audio-player-box">
                    <span>🔊 聴解音声スクリプト (Audio Script)</span>
                    <button class="play-btn" onclick="playAudioScript(\`${q.passage.replace(/`/g, '\`')}\`)">▶️ 音声を聴く (Play)</button>
                </div>
                <div class="passage-box">` + q.passage + `</div>
                ` + vocabHtml + `
                <div class="q-text">` + q.question + `</div>
                <ul class="options-list" id="opts-q-` + q.id + `">
                    ` + optionsHtml + `
                </ul>
                <button class="expl-btn" onclick="toggleExpl(` + q.id + `)">💡 講師の超詳細解説 (Prep-School Masterclass)</button>
                <div class="expl-box" id="expl-box-` + q.id + `">
                    <div class="lang-tabs">
                        <button class="tab-btn active" onclick="switchLang(` + q.id + `, 'en')">🇬🇧 English</button>
                        <button class="tab-btn" onclick="switchLang(` + q.id + `, 'si')">🇱🇰 Sinhala</button>
                    </div>
                    <div class="tab-content active" id="expl-en-` + q.id + `">
                        <div class="tip-card">` + q.tip_en + `</div>
                    </div>
                    <div class="tab-content" id="expl-si-` + q.id + `">
                        <div class="tip-card">` + q.tip_si + `</div>
                    </div>
                </div>
            `;
            qWrapper.appendChild(card);
        });
    }

    function selectOption(qId, selectedIdx, correctIdx) {
        const optsList = document.getElementById('opts-q-' + qId).children;
        const jumpBtn = document.getElementById('jump-btn-' + qId);
        
        for(let i=0; i<optsList.length; i++) {
            optsList[i].style.borderColor = '#e2e8f0';
            optsList[i].style.background = '#ffffff';
            optsList[i].style.color = '#334155';
            optsList[i].innerText = optsList[i].innerText.replace(' ❌', '').replace(' ✅', '');
        }
        
        if(selectedIdx === correctIdx) {
            optsList[selectedIdx].style.borderColor = '#10b981';
            optsList[selectedIdx].style.background = '#ecfdf5';
            optsList[selectedIdx].style.color = '#065f46';
            optsList[selectedIdx].innerText += ' ✅';
            jumpBtn.className = 'jump-btn correct';
            userAnswers[qId] = true;
        } else {
            optsList[selectedIdx].style.borderColor = '#ef4444';
            optsList[selectedIdx].style.background = '#fef2f2';
            optsList[selectedIdx].style.color = '#991b1b';
            optsList[selectedIdx].innerText += ' ❌';
            jumpBtn.className = 'jump-btn wrong';
            userAnswers[qId] = false;
        }
        
        updateScore();
    }

    function updateScore() {
        const correctCount = Object.values(userAnswers).filter(v => v === true).length;
        document.getElementById('score-counter').innerText = '正解数: ' + correctCount + ' / ' + questionsData.length;
    }

    function toggleExpl(qId) {
        const box = document.getElementById('expl-box-' + qId);
        box.classList.toggle('active');
    }

    function switchLang(qId, lang) {
        const box = document.getElementById('expl-box-' + qId);
        box.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        box.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        
        document.getElementById('expl-' + lang + '-' + qId).classList.add('active');
        box.querySelector('button[onclick*="' + lang + '"]').classList.add('active');
    }

    function filterCategory(cat, ev) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        if(ev) ev.target.classList.add('active');
        
        const cards = document.getElementById('questions-wrapper').querySelectorAll('.question-card');
        cards.forEach(card => {
            if(cat === 'all' || card.getAttribute('data-category') === cat) {
                card.style.display = 'block';
            } else {
                card.style.display = 'none';
            }
        });
    }

    renderApp();
</script>

</body>
</html>
